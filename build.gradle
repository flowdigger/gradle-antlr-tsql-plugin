import org.flowdigger.gradle.antlr.XmlAstGradleTask
import java.security.MessageDigest

plugins {
    id 'java'
    id 'antlr'
    id 'java-gradle-plugin'
    id 'jacoco'
    id 'org.flowdigger.gradle.antlr' version '1.0.0'
    id 'maven-publish'
    id 'signing'
    id 'checkstyle'
    id 'org.owasp.dependencycheck' version '13.0.0'
    id 'com.github.spotbugs' version '6.1.0'
    id 'org.sonarqube' version '6.0.1.5171'
}

group = 'org.flowdigger.gradle'
version = '1.0.0'

checkstyle {
    toolVersion = '10.26.1'
    configFile = file('checkstyle.xml')
}

ext {
    spotbugsEngineVersion = '4.8.6'
    findSecBugsVersion = '1.13.0'
}

gradlePlugin {
    website = 'https://github.com/flowdigger/gradle-antlr-tsql-plugin'
    vcsUrl = 'https://github.com/flowdigger/gradle-antlr-tsql-plugin'
    plugins {
        xmlAstTsql {
            id = 'org.flowdigger.gradle.antlr.tsql'
            implementationClass = 'org.flowdigger.gradle.antlr.XmlAstTsqlPlugin'
            displayName = 'Gradle ANTLR T-SQL Plugin'
            description = 'Preconfigured XML AST task support for T-SQL grammar parsing.'
            tags.set(['antlr', 'xml', 'ast', 'tsql'])
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation 'org.flowdigger.gradle:gradle-antlr-plugin:1.0.1'
    implementation 'org.antlr:antlr4-runtime:4.13.2'

    antlr 'org.antlr:antlr4:4.13.2'

    testImplementation gradleTestKit()
    testImplementation 'junit:junit:4.13.2'
    spotbugsPlugins "com.h3xstream.findsecbugs:findsecbugs-plugin:${findSecBugsVersion}"
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            pom {
                name = 'Gradle ANTLR T-SQL Plugin'
                description = 'Gradle plugin for XML AST conversion of T-SQL sources'
                url = 'https://github.com/flowdigger/gradle-antlr-tsql-plugin'

                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }

                developers {
                    developer {
                        id = 'flowdigger'
                        name = 'Flowdigger'
                    }
                }

                scm {
                    connection = 'scm:git:https://github.com/flowdigger/gradle-antlr-tsql-plugin.git'
                    developerConnection = 'scm:git:ssh://git@github.com/flowdigger/gradle-antlr-tsql-plugin.git'
                    url = 'https://github.com/flowdigger/gradle-antlr-tsql-plugin'
                }
            }
        }
    }

    repositories {
        mavenLocal()
        maven {
            name = 'sonatype'
            def releasesRepoUrl = 'https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/'
            def snapshotsRepoUrl = 'https://s01.oss.sonatype.org/content/repositories/snapshots/'
            url = uri(version.toString().endsWith('SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl)
            credentials {
                username = providers.gradleProperty('mavenCentralUsername').orNull
                password = providers.gradleProperty('mavenCentralPassword').orNull
            }
        }
    }
}

signing {
    def signingKey = providers.gradleProperty('signingKey').orNull
    def signingPassword = providers.gradleProperty('signingPassword').orNull
    def signingKeyId = providers.gradleProperty('signingKeyId').orNull
    def validKeyIdPattern = ~/(?i)^[0-9a-f]{8}([0-9a-f]{8})?$/
    def normalizedSigningKeyId = signingKeyId
            ?.trim()
            ?.replaceFirst(/^(?i)0x/, '')
    if (!(normalizedSigningKeyId ==~ validKeyIdPattern)) {
        normalizedSigningKeyId = null
    }
    if (signingKey && signingPassword) {
        if (normalizedSigningKeyId) {
            useInMemoryPgpKeys(normalizedSigningKeyId, signingKey, signingPassword)
        } else {
            useInMemoryPgpKeys(signingKey, signingPassword)
        }
    } else {
        useGpgCmd()
    }
    sign publishing.publications.mavenJava
}

def dependencyCheckSuppression = file('dependency-check-suppressions.xml')
dependencyCheck {
    formats = ['HTML', 'JSON', 'XML']
    failBuildOnCVSS = 7.0
    if (dependencyCheckSuppression.exists()) {
        suppressionFile = dependencyCheckSuppression.absolutePath
    }
    analyzers {
        ossIndex {
            enabled = false
        }
    }

    nvd {
        apiKey = findProperty('org.owasp.dependencycheck.nvd.api.key') ?: System.getenv('NVD_API_KEY')
    }
}

spotbugs {
    toolVersion = spotbugsEngineVersion
    ignoreFailures = false
    effort = com.github.spotbugs.snom.Effort.valueOf('DEFAULT')
    reportLevel = com.github.spotbugs.snom.Confidence.valueOf('MEDIUM')
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
    reports {
        html.required = true
        xml.required = false
    }
}

tasks.matching { it.name == 'spotbugsTest' }.configureEach {
    enabled = false
}

sonar {
    properties {
        property 'sonar.projectKey', 'gradle-antlr-tsql-plugin'
        property 'sonar.projectName', 'Gradle ANTLR T-SQL Plugin'
        property 'sonar.sourceEncoding', 'UTF-8'
        property 'sonar.java.source', '21'
    }
}

def grammarDir = file('src/main/antlr/org/flowdigger/parsers')
def antlrOutputDir = file('generated-src/antlr/main')
def antlrPackage = 'org.flowdigger.parsers'

tasks.register('generateLexerSources', JavaExec) {
    group = 'build'
    description = 'Generate ANTLR lexer sources for T-SQL grammar.'
    classpath = configurations.antlr
    mainClass = 'org.antlr.v4.Tool'
    inputs.files(fileTree(grammarDir) { include '*Lexer.g4' })
    outputs.dir(antlrOutputDir)
    doFirst {
        antlrOutputDir.mkdirs()
    }
    args '-listener', '-no-visitor', '-package', antlrPackage, '-o', antlrOutputDir.absolutePath,
            new File(grammarDir, 'TSqlLexer.g4').absolutePath
}

tasks.register('generateParserSources', JavaExec) {
    group = 'build'
    description = 'Generate ANTLR parser/listener sources after lexer token files are available.'
    dependsOn tasks.named('generateLexerSources')
    classpath = configurations.antlr
    mainClass = 'org.antlr.v4.Tool'
    inputs.files(fileTree(grammarDir) { include '*Parser.g4' })
    outputs.dir(antlrOutputDir)
    doFirst {
        antlrOutputDir.mkdirs()
    }
    args '-listener', '-no-visitor', '-package', antlrPackage,
            '-lib', antlrOutputDir.absolutePath, '-o', antlrOutputDir.absolutePath,
            new File(grammarDir, 'TSqlParser.g4').absolutePath
}

tasks.named('compileJava') {
    dependsOn tasks.named('generateParserSources')
    source += fileTree("$buildDir/generated-src/antlr/main")
}

tasks.register('compileAntlrSources', JavaCompile) {
    group = 'build'
    description = 'Compile ANTLR-generated Java sources.'
    dependsOn tasks.named('generateParserSources')
    source = fileTree(dir: 'generated-src/antlr/main', include: '**/*.java')
    classpath = configurations.antlr
    destinationDirectory.set(file("$buildDir/classes/java/antlr"))
}

sourceSets {
    main {
        java {
            srcDirs += ["$buildDir/generated-src/antlr/main"]
        }
        resources {
            srcDir 'src/main/antlr'
            include '**/*.g4'
        }
    }
}

tasks.named('jar', org.gradle.api.tasks.bundling.Jar) {
    dependsOn tasks.named('compileAntlrSources')
    from("$buildDir/classes/java/antlr") {
        include '**/*.class'
        into ''
    }
}

tasks.named('sourcesJar', org.gradle.api.tasks.bundling.Jar) {
    duplicatesStrategy = org.gradle.api.file.DuplicatesStrategy.EXCLUDE
}

tasks.withType(Test).configureEach {
    useJUnit()
}

jacoco {
    toolVersion = '0.8.12'
}

tasks.named('test') {
    classpath += files("$buildDir/classes/java/antlr")
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('compileTestJava') {
    dependsOn tasks.named('compileAntlrSources')
    classpath += files("$buildDir/classes/java/antlr")
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    classDirectories.setFrom(files(sourceSets.main.output.classesDirs))
    sourceDirectories.setFrom(files(sourceSets.main.allSource.srcDirs))
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

tasks.named('jacocoTestCoverageVerification') {
    dependsOn tasks.named('jacocoTestReport')
    classDirectories.setFrom(files(sourceSets.main.output.classesDirs))
    sourceDirectories.setFrom(files(sourceSets.main.allSource.srcDirs))
    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.20
            }
        }
    }
}

tasks.register('coverage') {
    group = 'verification'
    description = 'Runs tests, generates JaCoCo report, and verifies minimum coverage threshold.'
    dependsOn tasks.named('jacocoTestCoverageVerification')
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}

tasks.register('verifyGrammarSources') {
    group = 'verification'
    description = 'Checks that T-SQL grammar source files are present.'
    def required = [
            'src/main/antlr/org/flowdigger/parsers/TSqlLexer.g4',
            'src/main/antlr/org/flowdigger/parsers/TSqlParser.g4'
    ]
    def requiredFiles = required.collect { file(it) }
    inputs.files(requiredFiles)
    doLast {
        requiredFiles.each { f ->
            if (!f.isFile()) {
                throw new GradleException("Missing required grammar file: ${f.path}")
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyGrammarSources')
}

def configureXmlAstTask = { XmlAstGradleTask t, String sourcePath, String outputDirName, String taskDescription ->
    t.group = 'verification'
    t.description = taskDescription
    t.compression = true
    t.dependsOn tasks.named('compileAntlrSources')
    t.sourceDirectory.set(layout.projectDirectory.dir(sourcePath))
    t.destinationDirectory.set(layout.buildDirectory.dir("xmlast-samples/${outputDirName}"))
    t.parserClassName.set('org.flowdigger.parsers.TSqlParser')
    t.lexerClassName.set('org.flowdigger.parsers.TSqlLexer')
    t.startRule.set('tsql_file')
    t.includes.set(['**/*.sql'])
    t.targetExtension.set('.xml')
    t.continueOnError.set(true)
    t.suppressStackTrace.set(true)
    t.runtimeClasspath.from(configurations.runtimeClasspath, configurations.antlr, files("$buildDir/classes/java/antlr"))
}

tasks.named('xmlast', XmlAstGradleTask) {
    dependsOn tasks.named('xml-ast-tsql')
    onlyIf { false }
}

tasks.register('xml-ast-tsql', XmlAstGradleTask) {
    configureXmlAstTask(delegate, 'src/test/resources/tsql', 'tsql',
            'Parses T-SQL samples to XML AST for grammar validation.')
}

tasks.named('check') {
    dependsOn tasks.named('xmlast')
}

def centralArtifactId = (project.findProperty('mavenArtifactId') ?: project.name).toString()
def centralGroupPath = project.group.toString().replace('.', '/')

def stageCentralBundleRepo = tasks.register('stageCentralBundleRepo', Sync) {
    dependsOn tasks.named('publishToMavenLocal')
    def artifactVersionDir = file("${System.getProperty('user.home')}/.m2/repository/${centralGroupPath}/${centralArtifactId}/${project.version}")
    from(artifactVersionDir)
    into(layout.buildDirectory.dir("central-staging-repo/${centralGroupPath}/${centralArtifactId}/${project.version}"))
    doFirst {
        if (!artifactVersionDir.exists()) {
            throw new GradleException("Expected local Maven artifact version directory not found: ${artifactVersionDir}")
        }
    }
}

def generateCentralBundleChecksums = tasks.register('generateCentralBundleChecksums') {
    dependsOn stageCentralBundleRepo
    notCompatibleWithConfigurationCache('Generates checksum files by scanning staged output directory at execution time.')
    doLast {
        def stagedVersionDir = layout.buildDirectory.dir("central-staging-repo/${centralGroupPath}/${centralArtifactId}/${project.version}").get().asFile
        if (!stagedVersionDir.exists()) {
            throw new GradleException("Expected staged version directory not found: ${stagedVersionDir}")
        }
        def checksum = { File input, String algorithm ->
            MessageDigest digest = MessageDigest.getInstance(algorithm)
            input.withInputStream { stream ->
                byte[] buffer = new byte[8192]
                int read
                while ((read = stream.read(buffer)) >= 0) {
                    digest.update(buffer, 0, read)
                }
            }
            digest.digest().collect { String.format('%02x', it & 0xff) }.join('')
        }
        stagedVersionDir.eachFileRecurse { file ->
            if (file.isFile() && !file.name.endsWith('.md5') && !file.name.endsWith('.sha1')) {
                file.parentFile.toPath().resolve(file.name + '.md5').toFile().text = checksum(file, 'MD5') + System.lineSeparator()
                file.parentFile.toPath().resolve(file.name + '.sha1').toFile().text = checksum(file, 'SHA-1') + System.lineSeparator()
            }
        }
    }
}

tasks.register('packageCentralBundle', Zip) {
    dependsOn generateCentralBundleChecksums
    archiveBaseName = project.name
    archiveVersion = project.version.toString()
    archiveClassifier = 'central-bundle'
    destinationDirectory = layout.buildDirectory.dir('central-bundle').get().asFile
    from layout.buildDirectory.dir('central-staging-repo')
}
