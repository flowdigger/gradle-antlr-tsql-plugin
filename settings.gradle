pluginManagement {
    includeBuild('../flowdigger-gradle')
    def antlrPluginBuild = file('../gradle-antlr-plugin')
    if (System.getProperty('flowdigger.useLocalAntlrPlugin', 'false').toBoolean() && antlrPluginBuild.isDirectory()) {
        includeBuild('../gradle-antlr-plugin')
    }
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'org.flowdigger.antlr') {
                useModule("org.flowdigger.gradle:gradle-antlr-plugin:${requested.version ?: '1.0.3'}")
            }
        }
    }
}

def antlrPluginBuild = file('../gradle-antlr-plugin')
if (System.getProperty('flowdigger.useLocalAntlrPlugin', 'false').toBoolean() && antlrPluginBuild.isDirectory()) {
    includeBuild('../gradle-antlr-plugin')
}

rootProject.name = "gradle-antlr-tsql-plugin"

include(["use-case-01-direct", "use-case-02-catalog", "use-case-03-check-hook"])
project(":use-case-01-direct").projectDir = file("samples/use-case-01-direct")
project(":use-case-02-catalog").projectDir = file("samples/use-case-02-catalog")
project(":use-case-03-check-hook").projectDir = file("samples/use-case-03-check-hook")
